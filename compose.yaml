x-frontend-common: &frontend-common
  depends_on:
    api:
      condition: service_healthy
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - app-network
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-frontend-build-args: &frontend-build-args
  args:
    - NEXT_PUBLIC_API_BASEPATH=${NEXT_PUBLIC_API_BASEPATH}
    - API_BASEPATH=${API_BASEPATH}
    - NEXT_PUBLIC_PUBLIC_API_KEY=${NEXT_PUBLIC_PUBLIC_API_KEY}
    - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      args:
        - ENVIRONMENT=${ENVIRONMENT}
        - WITH_GPU=${WITH_GPU:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      - LOG_LEVEL=debug
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  public-viewer:
    <<: *frontend-common
    build:
      context: .
      dockerfile: ./apps/public-viewer/Dockerfile
      <<: *frontend-build-args
    ports:
      - "3000:3000"

  public-viewer-dev:
    <<: *frontend-common
    image: node:22-alpine
    working_dir: /repo
    command: >
      sh -c "corepack enable && pnpm install && pnpm --filter ./apps/public-viewer dev"
    profiles:
      - dev
    volumes:
      - .:/repo
      - public-viewer-dev-node_modules:/repo/node_modules
    ports:
      - "3000:3000"

  static-site-builder:
    <<: *frontend-common
    build:
      context: .
      dockerfile: ./apps/static-site-builder/Dockerfile
      <<: *frontend-build-args

  admin:
    <<: *frontend-common
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
      args:
        - NEXT_PUBLIC_CLIENT_BASEPATH=${NEXT_PUBLIC_CLIENT_BASEPATH}
        - NEXT_PUBLIC_API_BASEPATH=${NEXT_PUBLIC_API_BASEPATH}
        - NEXT_PUBLIC_ADMIN_API_KEY=${NEXT_PUBLIC_ADMIN_API_KEY}
        - API_BASEPATH=http://api:8000
        - CLIENT_STATIC_BUILD_BASEPATH=${CLIENT_STATIC_BUILD_BASEPATH}
    ports:
      - "4000:4000"
    environment:
      - API_BASEPATH=http://api:8000

  admin-dev:
    <<: *frontend-common
    image: node:22-alpine
    working_dir: /repo
    command: >
      sh -c "corepack enable && pnpm install && pnpm --filter ./apps/admin dev"
    profiles:
      - dev
    env_file:
      - .env
    volumes:
      - .:/repo
      - admin-dev-node_modules:/repo/node_modules
    ports:
      - "4000:4000"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 10
        ollama pull hf.co/elyza/Llama-3-ELYZA-JP-8B-GGUF
        tail -f /dev/null

networks:
  app-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
  public-viewer-dev-node_modules:
    driver: local
  admin-dev-node_modules:
    driver: local
